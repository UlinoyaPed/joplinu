name: JoplinU checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/joplinu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/joplinu/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm test
      - run: npm run test:packaging
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          export PLAYWRIGHT_CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run test:browser
          npm run test:production
      - name: Upload layout previews
        uses: actions/upload-artifact@v4
        with:
          name: joplinu-layout-previews
          path: experiments/joplinu/test-results/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: joplinu-browser-failures
          path: experiments/joplinu/test-results
