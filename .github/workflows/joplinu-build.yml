name: JoplinU desktop and Android builds

on:
  push:
    branches: ['dev']
    tags: ['v*']
    paths: ['experiments/joplinu/**', '.github/workflows/joplinu-*.yml']
  pull_request:
    paths: ['experiments/joplinu/**', '.github/workflows/joplinu-*.yml']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign release artifacts with configured repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: joplinu-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    uses: ./.github/workflows/joplinu-editor-poc.yml

  storage:
    name: Real S3 compatibility
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/joplinu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/joplinu/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run storage:setup
      - run: npm run test:storage:s3

  rpm:
    needs: [checks, storage]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/joplinu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/joplinu/package-lock.json
      - name: Install RPM and Electron runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build RPM
        run: npm run desktop:package
      - name: Collect and optionally sign RPM
        env:
          RPM_GPG_PRIVATE_KEY_BASE64: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.RPM_GPG_PRIVATE_KEY_BASE64 || '' }}
          RPM_GPG_KEY_ID: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.RPM_GPG_KEY_ID || '' }}
          RPM_GPG_PASSPHRASE: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.RPM_GPG_PASSPHRASE || '' }}
        run: node scripts/collect-rpm.mjs
      - name: Launch the packaged Electron application
        env:
          JOPLINU_ELECTRON_EXECUTABLE: ${{ github.workspace }}/experiments/joplinu/artifacts/desktop/linux-unpacked/joplinu
        run: xvfb-run -a npm run test:desktop
      - name: Inspect RPM package
        run: rpm -qp --queryformat '%{NAME} %{VERSION} %{ARCH}\n' artifacts/desktop/*.rpm
      - name: Test RPM signing with a temporary key
        run: node scripts/signing-smoke.mjs rpm artifacts/desktop/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: joplinu-linux-x64-rpm
          if-no-files-found: error
          path: |
            experiments/joplinu/artifacts/desktop/*.rpm
            experiments/joplinu/artifacts/desktop/*.asc
            experiments/joplinu/artifacts/desktop/SHA256SUMS
            experiments/joplinu/artifacts/desktop/build-info.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: joplinu-electron-diagnostics
          path: experiments/joplinu/test-results/

  windows:
    needs: [checks, storage]
    runs-on: windows-2025
    defaults:
      run:
        working-directory: experiments/joplinu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/joplinu/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npm run build:windows
      - name: Launch packaged Windows application
        env:
          JOPLINU_ELECTRON_EXECUTABLE: ${{ github.workspace }}/experiments/joplinu/artifacts/windows/win-unpacked/JoplinU.exe
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: joplinu-windows-x64-installer
          if-no-files-found: error
          path: |
            experiments/joplinu/artifacts/windows/*.exe
            experiments/joplinu/artifacts/windows/SHA256SUMS
            experiments/joplinu/artifacts/windows/build-info.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: joplinu-windows-diagnostics
          path: experiments/joplinu/test-results/

  apk:
    needs: [checks, storage]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/joplinu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/joplinu/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --ignore-scripts
      - name: Build APKs and run Android lint
        env:
          JOPLINU_VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run build
          npm run android:sync
          npm run android:assemble
      - name: Collect APKs and optionally sign release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.sign)) && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: node scripts/collect-android.mjs
      - name: Verify installable debug APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/android/*-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/android/*-debug.apk
      - name: Test release signing with a temporary key
        run: node scripts/signing-smoke.mjs apk apps/android/native/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare real S3 service for Android
        run: |
          npm run storage:setup
          node scripts/android-cloud-fixture.mjs > "$RUNNER_TEMP/joplinu-android-cloud.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/joplinu-android-cloud.pid"
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:10081/ready > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test actual Android WebView, SQLite and cloud transport
        env:
          JOPLINU_VERSION_CODE: ${{ github.run_number }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: npm --prefix experiments/joplinu run android:test
      - name: Stop temporary S3 service
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import { readFile, access } from 'node:fs/promises';
          const path = process.env.RUNNER_TEMP + '/joplinu-android-cloud.pid';
          try { await access(path); const pid = Number(await readFile(path, 'utf8')); if (Number.isSafeInteger(pid) && pid > 1) process.kill(pid, 'SIGTERM'); } catch {}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: joplinu-android-apk
          if-no-files-found: error
          path: experiments/joplinu/artifacts/android/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: joplinu-android-lint
          path: |
            experiments/joplinu/apps/android/native/app/build/reports/
            ${{ runner.temp }}/joplinu-android-cloud.log
